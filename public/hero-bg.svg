<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Cinematic dark backdrop with city skyline silhouette + neon glow -->
  <defs>
    <radialGradient id="redGlow" cx="20%" cy="40%" r="55%">
      <stop offset="0%"  stop-color="#e50914" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e50914" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="78%" cy="68%" r="42%">
      <stop offset="0%" stop-color="#7c1d6f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c1d6f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="92%" r="50%">
      <stop offset="0%" stop-color="#ffb800" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffb800" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffb800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="#0a0a0a"/>

  <!-- Soft glow layers -->
  <rect width="1920" height="1080" fill="url(#redGlow)"/>
  <rect width="1920" height="1080" fill="url(#purpleGlow)"/>
  <rect width="1920" height="1080" fill="url(#amberGlow)"/>

  <!-- City skyline silhouette at bottom — buildings of varying heights -->
  <g fill="#000000" opacity="0.85" filter="url(#blur)">
    <rect x="0"    y="780" width="120" height="300"/>
    <rect x="115"  y="700" width="80"  height="380"/>
    <rect x="190"  y="820" width="110" height="260"/>
    <rect x="295"  y="640" width="95"  height="440"/>
    <rect x="385"  y="760" width="140" height="320"/>
    <rect x="520"  y="600" width="100" height="480"/>
    <rect x="615"  y="700" width="125" height="380"/>
    <rect x="735"  y="540" width="85"  height="540"/>
    <rect x="815"  y="680" width="170" height="400"/>
    <rect x="980"  y="620" width="110" height="460"/>
    <rect x="1085" y="720" width="140" height="360"/>
    <rect x="1220" y="580" width="90"  height="500"/>
    <rect x="1305" y="700" width="160" height="380"/>
    <rect x="1460" y="660" width="115" height="420"/>
    <rect x="1570" y="780" width="130" height="300"/>
    <rect x="1695" y="640" width="100" height="440"/>
    <rect x="1790" y="740" width="140" height="340"/>
  </g>

  <!-- Tiny "window lights" dots on buildings for life -->
  <g fill="#ffb800" opacity="0.55">
    <circle cx="150"  cy="780" r="2"/>
    <circle cx="155"  cy="820" r="2"/>
    <circle cx="320"  cy="700" r="2"/>
    <circle cx="350"  cy="750" r="2"/>
    <circle cx="560"  cy="720" r="2"/>
    <circle cx="580"  cy="780" r="2"/>
    <circle cx="780"  cy="640" r="2"/>
    <circle cx="800"  cy="700" r="2"/>
    <circle cx="900"  cy="780" r="2"/>
    <circle cx="1020" cy="720" r="2"/>
    <circle cx="1140" cy="800" r="2"/>
    <circle cx="1250" cy="680" r="2"/>
    <circle cx="1280" cy="740" r="2"/>
    <circle cx="1380" cy="780" r="2"/>
    <circle cx="1500" cy="720" r="2"/>
    <circle cx="1620" cy="820" r="2"/>
    <circle cx="1740" cy="700" r="2"/>
    <circle cx="1830" cy="800" r="2"/>
  </g>
  <g fill="#e50914" opacity="0.6">
    <circle cx="170"  cy="900" r="2"/>
    <circle cx="450"  cy="880" r="2"/>
    <circle cx="700"  cy="860" r="2"/>
    <circle cx="940"  cy="900" r="2"/>
    <circle cx="1180" cy="870" r="2"/>
    <circle cx="1450" cy="890" r="2"/>
    <circle cx="1720" cy="870" r="2"/>
  </g>

  <!-- Top + bottom fades -->
  <rect width="1920" height="1080" fill="url(#topFade)"/>
  <rect width="1920" height="1080" fill="url(#bottomFade)"/>
</svg>
